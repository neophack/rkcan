name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go:
    name: Go (vet, test, cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/rkcan-linux-arm64 .

      - name: Build linux/arm (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/rkcan-linux-arm32 .

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/rkcan-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: rkcan
          path: dist/*
          if-no-files-found: error

  receiver:
    name: UdpCanFdReceiver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S UdpCanFdReceiver -B UdpCanFdReceiver/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build UdpCanFdReceiver/build --config Release

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          find UdpCanFdReceiver/build -type f \( -name 'udp_canfd_*' -perm -u+x -o -name 'udp_canfd_*.exe' \) \
            -not -path '*/CMakeFiles/*' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: udp-canfd-receiver-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, receiver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package receiver binaries
        run: |
          mkdir -p release
          cp artifacts/rkcan/* release/
          cd artifacts
          for d in udp-canfd-receiver-*; do
            (cd "$d" && zip -q "../../release/$d.zip" *)
          done
          ls -l ../release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
