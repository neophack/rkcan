# RKCAN configuration
#
# Shell-style KEY=VALUE file, read by the systemd service (EnvironmentFile)
# and by the SysV/BusyBox init script. Every rkcan command line flag can be
# set here as RKCAN_<FLAG> (upper case, '-' becomes '_'); run "rkcan -help"
# for the full list. Apply changes with:  rkcan-ctl restart

# ---------------------------------------------------------------- bridge ----
# UDP target that receives every CAN frame
RKCAN_ADDR=10.0.0.22:6000
# CAN interfaces (empty = disabled). Log channel 1 = CAN0, 2 = CAN1.
RKCAN_CAN0=can0
RKCAN_CAN1=can1
# Encode FD/BRS/ESI flags in the high nibble of the UDP DLC byte
RKCAN_UDPFLAGS=false

# ------------------------------------------------------------- dashboard ----
RKCAN_PORT=80
# Listen address (empty = all interfaces)
RKCAN_LISTEN=
# Optional login for the web dashboard, format user:password
RKCAN_AUTH=
# Root directory of the file manager (also searched for replay logs)
RKCAN_FILEROOT=/userdata
RKCAN_WIFI=wlan0

# ------------------------------------------------------------- transmit -----
# Send CAN-FD frames with bit rate switch (time sync and demo sender)
RKCAN_BRS=false
# Start CAN time sync at boot on this interface (empty = off), protocol 5A4 or 594
RKCAN_TIMESYNC=
RKCAN_TIMESYNC_PROTO=5A4

# --------------------------------------------------------------- logging ----
# Log file (empty = stderr / journald). The init script defaults to
# /var/log/rkcan.log on systems without systemd.
#RKCAN_LOGFILE=/var/log/rkcan.log
RKCAN_LOGMAX=10

# ------------------------------------------------- CAN interface setup ------
# Applied by rkcan-can-setup before rkcan starts. Set CAN_SETUP=no if the
# interfaces are configured elsewhere (e.g. systemd-networkd).
CAN_SETUP=yes
CAN_BITRATE=500000
CAN_SAMPLE_POINT=0.875
# CAN-FD: on/off. With "on" the data phase uses CAN_DBITRATE when BRS is set.
CAN_FD=on
CAN_DBITRATE=2000000
CAN_DSAMPLE_POINT=0.8
# Automatic recovery from bus-off after this many ms (0 = manual)
CAN_RESTART_MS=100
# Device TX queue length; the kernel default of 10 is too small for replay
CAN_TXQUEUELEN=1000
# Per-interface overrides: CAN0_<NAME> for RKCAN_CAN0, CAN1_<NAME> for RKCAN_CAN1
#CAN1_BITRATE=250000
#CAN1_FD=off
